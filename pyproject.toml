[project]
name = "crisp-gym"
version = "4.2.1"
description = "Simple gymnasium environments for crisp_py"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name="Maximilian Dösch", email="doesch.maximilian@gmail.com"},
    {name="Daniel San Jose Pro", email="sanjose.daniel@gmail.com"},
]
dependencies = [
    "ruff>=0.11.9",
    "gymnasium>=0.26.3,<2",
    # Loosened so the conda-provided scipy (robostack ROS stack) satisfies it
    # instead of a conflicting pip install — see pixi.toml [dependencies].
    "scipy>=1.10,<2",
    "crisp_python>=3.0.0,<4",
    "rich>=14.0.0, <15",
    "pyyaml",
]

[project.optional-dependencies]
# For scripts/postprocess_align_datasets.py (runs on the training PC).
postprocess = ["pandas", "pyarrow"]

[project.scripts]
crisp-deploy-policy = "crisp_gym.scripts.deploy_policy:main"
crisp-record-leader-follower = "crisp_gym.scripts.record_lerobot_format_leader_follower:main"
crisp-check-config = "crisp_gym.scripts.check_config:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the repository root, so `crisp_gym` imports without an install or PYTHONPATH
pythonpath = ["."]
markers = [
    "lerobot: needs the real lerobot and torch packages; skipped where they are not installed",
    "ros: needs a ROS 2 environment (rclpy, crisp_py); skipped where it is not there",
]

[tool.ruff]
exclude = [
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py311"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["config"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "TCH", "ANN"]
ignore = ["ANN401"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests and examples are read top to bottom, not called: a docstring and type
# annotations on every helper and every test function add nothing there. The
# rules that find real mistakes (unused or undefined names, import order,
# syntax) still apply to them.
"tests/**" = ["D", "ANN"]
"examples/**" = ["D", "ANN"]

# BASELINE, 23 files, 231 findings on 2026-11-15 (two files since deleted): docstring and annotation rules these
# files did not meet when the lint job was first made to pass. Each entry
# lists only the rules that file breaks (the number is how often), so anything
# else in it, and every file not listed here, is held to the full rule set.
# This is a list to SHORTEN: fix a file, delete its line. Do not add to it.
"crisp_gym/config/home.py" = ["ANN001"]  # 1
"crisp_gym/envs/env_wrapper.py" = ["D103"]  # 1
"crisp_gym/envs/umi_handheld_env.py" = ["ANN003", "D102", "D105", "D107"]  # 9
"crisp_gym/policy/relative_lerobot_policy.py" = ["ANN001", "D107", "D205"]  # 5
"crisp_gym/policy/remote_policy.py" = ["D102", "D107"]  # 4
"crisp_gym/policy/remote_protocol.py" = ["ANN001", "ANN003", "ANN202", "D103"]  # 11
"crisp_gym/record/record_config.py" = ["ANN001", "ANN201", "ANN202", "D102", "D105", "D205"]  # 26
"crisp_gym/record/record_functions.py" = ["ANN001", "ANN202", "D205"]  # 10
"crisp_gym/record/recording_manager.py" = ["ANN001", "ANN003", "D105", "D107"]  # 7
"crisp_gym/scripts/check_policy_openloop.py" = ["ANN001", "ANN201", "ANN202", "D103"]  # 39
"crisp_gym/scripts/check_relative_pose.py" = ["D103", "D205"]  # 2
"crisp_gym/scripts/lerobot_relative_pose.py" = ["ANN001", "ANN202", "ANN204", "D102", "D105", "D107", "D301"]  # 25
"crisp_gym/scripts/migrate_euler_delta_to_rot6d.py" = ["ANN001", "ANN201", "D103", "D205", "D301"]  # 14
"crisp_gym/scripts/postprocess_align_datasets.py" = ["ANN001", "ANN202", "D103", "D301", "D415"]  # 10
"crisp_gym/scripts/record_umi_handheld.py" = ["D103", "D301"]  # 2
"crisp_gym/scripts/reencode_dataset_videos.py" = ["ANN001"]  # 1
"crisp_gym/scripts/swap_action_offline.py" = ["ANN001", "ANN201", "D103", "D301"]  # 6
"crisp_gym/scripts/train_absolute_next_pose.py" = ["ANN001", "ANN202", "D301"]  # 10
"crisp_gym/scripts/train_action_from_target_cartesian.py" = ["ANN001", "ANN202", "ANN204", "D102", "D105", "D107", "D301"]  # 27
"crisp_gym/teleop/spacemouse_node.py" = ["ANN201", "D102", "D103", "D107"]  # 6
"crisp_gym/teleop/teleop_factr_stream.py" = ["D102", "D107", "D301"]  # 6
"crisp_gym/util/epoch_steps.py" = ["ANN001", "ANN202", "D107"]  # 5
"crisp_gym/util/lerobot_features.py" = ["ANN001"]  # 4

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
