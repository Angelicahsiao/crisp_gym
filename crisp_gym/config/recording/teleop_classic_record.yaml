# Classic crisp_gym teleop contract: action = the delta-pose command sent to
# the follower (NOT UMI-compatible — do not mix with next_tcp_pose datasets).
name: "teleop_classic"
rate_hz: 15.0

observations:
  - key: observation.state.cartesian
    source: robot.tcp_pose
    representation: euler
  - key: observation.state.gripper
    source: gripper.width_normalized   # raw calibrated [0,1], no unification
  - key: observation.images.primary
    source: camera.image
    camera: primary
    shape: [224, 224, 3]

action:
  # The action column is exactly the vector handed to env.step(). Its width and
  # names are derived from the env's own action_space at record time
  # (util.lerobot_features.env_action_names), so nothing is declared here:
  # a Cartesian env yields [x, y, z, <rotation dims>, gripper].
  #
  # Whether those are DELTAS or absolute follows the env's use_relative_actions
  # (true for the classic teleop path this config is used with).
  definition: command
