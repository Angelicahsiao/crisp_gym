name: Tests

# The part of the test suite that needs no ROS, no robot and no GPU.
# Tests that need the real lerobot/torch or a ROS environment are marked
# `lerobot` / `ros` and skip themselves here (see tests/conftest.py); the
# skipped ones are listed at the end of the log, with the reason.
on: push

jobs:
  rosfree:
    name: pytest (Python ${{ matrix.python-version }}, no ROS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install the ROS-free test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
      - name: Run the tests
        run: python -m pytest -q -rs
