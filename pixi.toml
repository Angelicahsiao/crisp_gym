[workspace]
preview = ["pixi-build"]
authors = [
    "Maximilian Dösch <doesch.maximilian@gmail.com>",
    "Daniel San José Pro <42489409+danielsanjosepro@users.noreply.github.com>"
]
channels = ["https://fast.prefix.dev/conda-forge"]
name = "crisp_gym"
platforms = ["linux-64"]

[activation]
scripts = [
    "scripts/set_env.sh",
    "scripts/gen_cyclone_config.sh",
]

[dependencies]
# 3.12 is REQUIRED by lerobot >= 0.5 (its pyproject declares
# requires-python >= 3.12). Do not lower this without also pinning lerobot
# back to 0.4.x.
python = "3.12.*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
typing_inspect = ">=0.9.0,<0.10"
libstdcxx-ng = ">=12.2.0"
typing-extensions = ">=4.14.0,<5"
# These two mirror lerobot 0.6.1's OWN bounds (numpy>=2.0.0,<2.3.0 and
# packaging>=24.2,<26.0). Declared here so the conda solve lands inside the
# range uv will later demand, instead of resolving numpy first and conflicting.
numpy = ">=2.0,<2.3"
packaging = "<26.0"
# pinocchio is NOT here on purpose: it exists only on conda-forge (not
# robostack), so requiring it forced the shared scientific stack to resolve
# from conda-forge. Under the old numpy-1.26 env that pulled conda-forge's
# numpy-2-built scipy and broke it (the _spropack ImportError). The external
# joint-effort estimator that needs pinocchio is being relocated to a robot
# bring-up node (crisp_controllers_demos); crisp_gym only consumes its topic.


[target.linux.dependencies]
libgl-devel = "*"

[environments]
dev = { features = ["dev"] }
humble = { features = ["humble"] }
humble-lerobot = { features = ["humble", "lerobot", "dev"] }
lerobot = { features = ["lerobot"] }
# Jazzy is COMMENTED OUT deliberately. `pixi install` solves every declared
# environment, not just the one named with -e, so a jazzy env that cannot be
# solved (robostack-jazzy against this python/numpy combination) fails the
# whole command and blocks the humble envs from installing. Re-enable only
# together with a jazzy solve that is known to work.
#jazzy = { features = ["jazzy"] }
#jazzy-lerobot = { features = ["jazzy", "lerobot", "dev"] }

[feature.dev.pypi-dependencies]
pre-commit = "*"
ruff = "*"
debugpy = ">=1.8.14,<2"
pudb = ">=2025.1.3, <2026"

[feature.lerobot.dependencies]
pynput = "*"

[feature.lerobot.pypi-dependencies]
# === local clone (v0.6.1 — native for this Python 3.12 + numpy 2 env) ===
# Clone it as a SIBLING of this repo (the path below is relative to pixi.toml):
#   git clone --branch v0.6.1 https://github.com/huggingface/lerobot.git ../lerobot
#
# Do NOT run scripts/setup_lerobot.sh for v0.6.x: its patches are triggered by
# grep, not by LEROBOT_REV, and would rewrite the clone's requires-python
# 3.12 -> 3.11 and numpy >=2.0 -> >=1.26 — exactly what this env moved to.
# v0.6.1 needs no patches: its opencv-python-headless bound (<4.14) accepts the
# conda-provided opencv, and numpy/packaging are pinned to its own ranges above.
#
# extras = ["dataset"] is REQUIRED, not optional: `datasets`, `torchcodec` and
# `av` are only declared under that extra, and lerobot/datasets/__init__.py
# raises at IMPORT time without them. record/recording_manager.py imports
# LeRobotDataset, so recording cannot start at all if the extra is missing.
# Add "diffusers-dep" as well if you train diffusion policies IN THIS env
# rather than on a separate training machine.
lerobot = { path = "../lerobot", editable = true, extras = ["dataset"] }
# === v0.6.1 from PyPI (alternative to the local clone) ===
# lerobot = { version = "==0.6.1", extras = ["dataset"] }

[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
rosdep = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
# image-transport-plugins is numpy-1 ONLY: every build robostack offers
# (2.5.0-2.5.5, and its ros-humble-theora-image-transport dep) requires
# numpy <2.0a0, so declaring it makes the numpy-2 solve above unsatisfiable:
#   ros-humble-image-transport-plugins * cannot be installed ...
#     would require numpy >=1.26.4,<2.0a0, for which no candidates were found
# It provides the COMPRESSED image transports; the env configs subscribe to
# raw topics (…/color/image_rect_raw), so dropping it costs nothing there.
# Re-enable only in a numpy-1 environment.
#ros-humble-image-transport-plugins = "*"
# cv_bridge: required by crisp_py.camera (from cv_bridge import CvBridge).
# Deliberately NOT declared explicitly. An unconstrained "*" lets the solver
# pick an old cv-bridge build that requires numpy < 2, which makes the numpy-2
# solve above unsatisfiable. It still ships inside ros-humble-desktop, which
# resolves a numpy-2-compatible build transitively — so the import stays
# available without constraining the solve.
#ros-humble-cv-bridge = "*"
# scipy: crisp imports scipy.spatial.transform.Rotation in ~8 places
# (crisp_py/robot/robot.py, crisp_gym/envs/manipulator_env.py, ...), so it MUST
# be present. It is not declared here, and note that the previous comment's
# reasoning was wrong: lerobot does NOT provide scipy. Checked against PyPI
# metadata for 0.4.4, 0.6.0 and 0.6.1 — scipy appears only under extras
# ("wallx" in 0.4.4, "scipy-dep"/"all" in 0.6.x), never as a base dependency,
# so `extras = ["dataset"]` pulls none. It currently arrives transitively via
# ros-humble-desktop. VERIFY after any solve change:
#   pixi run -e humble-lerobot python -c "import scipy; print(scipy.__version__)"
# If it is ever missing, add a conda scipy here — safe now that this env is on
# numpy 2 (the old _spropack ImportError came from a numpy-2-built scipy meeting
# robostack's numpy 1.26, a combination that no longer exists here).

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
colcon-common-extensions = "*"
rosdep = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rmw-zenoh-cpp = "*"

[pypi-dependencies]
crisp_gym = { path = ".", editable = true }
# Use the LOCAL crisp_py checkout (editable) rather than the PyPI `crisp_python`
# wheel that `crisp_gym`'s pyproject pin (crisp_python>=3.0.0,<4) would otherwise
# resolve. The published wheel lags this repo — e.g. it predates RobotConfig's
# `has_effort_feedback` field (added in crisp_py d7e45d5), so recording configs
# that set `has_effort_feedback: true` crash with
# `URConfig.__init__() got an unexpected keyword argument 'has_effort_feedback'`.
# The path override satisfies the same `crisp_python` requirement from source.
crisp_python = { path = "../crisp_py", editable = true }

[tasks]
configure = "bash scripts/configure.sh"
